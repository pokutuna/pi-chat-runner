# Single-file config fixture: channels loading must not touch the system block
# (its ${env.X} refs would throw if resolved). agent.env IS resolved, so its
# refs carry ${env.X:-default} fallbacks.
system:
  chat:
    slack:
      mode: socket
      botToken: ${env.UNSET_FIXTURE_BOT_TOKEN}
      botUserId: ${env.UNSET_FIXTURE_BOT_USER_ID}
      socket:
        appToken: ${env.UNSET_FIXTURE_APP_TOKEN}

  state:
    control:
      backend: ${env.UNSET_FIXTURE_STORE_BACKEND:-memory}

agent:
  env:
    SECRET: ${env.UNSET_FIXTURE_SECRET:-fallback-secret}

channels:
  - channel: "default"
    trigger:
      when:
        - kind: mention
    agent:
      systemPrompt: "single-file default prompt"
