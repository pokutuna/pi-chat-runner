channels:
  - channel: "default"
    trigger:
      when:
        - kind: mention
  - channel: "C0000000001"
    trigger:
      when:
        - kind: mention
    agent:
      systemPrompt: ./prompts/greeting.md
      context:
        - ./prompts/context-note.md
        - inline text without file reference
      model: google/gemini-3-pro
  - channel: "#keyword-demo"
    trigger:
      when:
        - kind: keyword
          pattern: "(?i)(help|error)"
        - kind: mention
  - channel: "C0000000004"
    trigger:
      allowBots: true
      when:
        - kind: mention
