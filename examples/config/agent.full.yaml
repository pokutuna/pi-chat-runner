# agent.full.yaml — a fully-populated reference config, exercising every field
# the schema accepts. Not a template to copy verbatim — a map of the config
# surface, organized around one imagined deployment:
#
#   salmon-agent: a shared ops/dev bot for one team, wired into
#   - #incidents      (public)  — infra alert triage, high signal-to-noise bar
#   - #team-random    (public)  — casual mention-only Q&A
#   - #team-lab       (private) — the team's own sandbox, anything goes
#   - DM              — 1:1 scratchpad, long-lived per-user session
#   - everything else (default) — quiet, mention-only fallback
#
# See examples/config/agent.yaml for a smaller, more realistic starting point,
# and docs/design/config.md for the full semantics behind each field.

connector:
  slack:
    mode: ${env.SLACK_MODE:-socket}
    appToken: ${env.SLACK_APP_TOKEN:-}
    signingSecret: ${env.SLACK_SIGNING_SECRET:-}
    port: ${env.PORT:-8080}
    botToken: ${env.SLACK_BOT_TOKEN}
    botUserId: ${env.SLACK_BOT_USER_ID}

store:
  backend: ${env.STORE_BACKEND:-sqlite}
  sqlite:
    path: ${env.SQLITE_PATH:-/tmp/pi-chat-runner/state.db}
  firestore:
    projectId: ${env.FIRESTORE_PROJECT_ID:-}
    database: ${env.FIRESTORE_DATABASE:-(default)}
    rootDoc: ${env.FIRESTORE_ROOT_DOC:-pi-chat-runner/default}

pi:
  provider: ${env.PI_PROVIDER:-google-vertex}
  turnTimeoutMs: ${env.TURN_TIMEOUT_MS:-600000}
  # 0 disables progress notices outright (unlike turnTimeoutMs, 0 is a valid,
  # meaningful value here, not "unset").
  progressNoticeIntervalMs: ${env.PROGRESS_NOTICE_INTERVAL_MS:-20000}

agent:
  env:
    # Additive allowlist — only names listed here reach the pi child process
    # (on top of the code's built-in GOOGLE_CLOUD_* defaults). This is not a
    # passthrough of the runner's own process.env.
    GH_TOKEN: ${env.GH_TOKEN:-}
    SLACK_TEAM_NAME: salmon
  runtime:
    # UID/GID separation: both or neither.
    uid: ${env.PI_AGENT_UID:-1001}
    gid: ${env.PI_AGENT_GID:-1001}
    permissionMode: ${env.PI_PERMISSION_MODE:-true}
    home: ${env.PI_AGENT_HOME:-/home/agent}

channels:
  # --- default: quiet fallback for any channel the bot ends up in without an
  # explicit entry below. Mention-only on purpose — passthrough/classifier
  # here would silently start judging every message in every future channel.
  - channel: "default"
    model: gemini-3.5-flash
    systemPrompt: ./prompts/ask-ai.md
    trigger:
      when:
        - kind: mention

  # --- dm: 1:1 scratchpad. channel-mode session (one continuous thread per
  # user, not per-message), rotated after a day of silence or once the
  # transcript gets large, so a session doesn't grow unbounded across weeks.
  - channel: "dm"
    model: gemini-3.5-flash
    systemPrompt: ./prompts/ask-ai.md
    trigger:
      when:
        - kind: passthrough
    session:
      mode: channel
      idleResetMinutes: 1440 # 24h idle -> new generation
      maxTranscriptKb: 1024
    reply:
      mode: flat

  # --- #incidents (public): the highest-stakes channel. Triggers on an
  # explicit mention, OR (keyword match AND classifier confirmation) so a
  # bare "error" in idle chatter doesn't page the bot, but "error 500 on
  # checkout, spiking" does. Also reaction-startable, so someone can eyeball
  # a message from before the bot joined and kick a session on it after the
  # fact. debounce absorbs a burst of 3-4 rapid-fire alert lines into one
  # session kick instead of one per line.
  - channel: "C0INCIDENTS0"
    model: gemini-3.5-flash
    systemPrompt: ./prompts/incidents.md
    context:
      - ./prompts/oncall-runbook-index.md
    tools: [read, grep, bash]
    excludeTools: [write, edit]
    skills:
      - /app/skills/gc-logging
      - /app/skills/pagerduty
    extensions:
      - /app/extensions/bq-runner.ts
    session:
      mode: thread
      affinity:
        scope: channel
        windowSec: 600
        debounceSec: 20
    reply:
      mode: thread
    trigger:
      # cooldownSec: 120  # implementation on hold — the strict schema rejects it (config.md §7)
      when:
        - kind: mention
        - kind: reaction
          emoji: [eyes, robot_face]
        - and:
            # restrict keyword auto-trigger to on-call members; matches the
            # normalized display name resolved by the EventSource (config.md §7).
            # rename-proof alternative: id: [U012AB34CD, U056EF78GH]
            - kind: sender
              name: [alice, bob]
            - kind: keyword
              pattern: "(ALERT|ERROR|CRIT|5[0-9]{2})"
            - kind: classifier
              criteria: "Describes an active production incident or outage — not a question about past incidents, not idle chatter mentioning the word error."
              model: gemini-3.1-flash-lite

  # --- #team-random (public): low-stakes, mention-only Q&A. No skills/tools
  # restrictions — full default toolset.
  - channel: "C0TEAMRANDOM0"
    model: gemini-3.5-flash
    systemPrompt: ./prompts/ask-ai.md
    trigger:
      when:
        - kind: mention

  # --- #team-lab (private): the team's own sandbox. Passthrough — every
  # message is judged as a turn, no mention needed. Deliberately isolated to
  # a channel the team opted into, since passthrough elsewhere would be
  # unwelcome noise.
  - channel: "C0TEAMLAB000"
    model: gemini-3.5-flash
    systemPrompt: |
      You're in #team-lab, an opt-in sandbox. Assume every message is
      directed at you; keep replies short unless asked to elaborate.
    extensions:
      - /app/extensions/bq-runner.ts
    trigger:
      when:
        - kind: passthrough
