name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # FirestoreStateStore の contract テスト用 (persistence.md §1)。
      # services: では起動コマンドを渡せない (entrypoint/command キーは未サポート、
      # options: の --entrypoint だけでは引数を渡せない) ため docker run で起動する。
      # イメージ pull に時間がかかるので、後続ステップと並行させるべく早めに起動する。
      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 \
            --entrypoint sh gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            -c "gcloud emulators firestore start --host-port=0.0.0.0:8080"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # エミュレータの起動はコンテナ起動と非同期なので、ポートが開くまで待つ。
      # レスポンス本文は公式に規定がないため、到達可否だけを見る。
      - name: Wait for Firestore emulator
        run: timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 1; done'

      - name: Test
        run: pnpm test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
