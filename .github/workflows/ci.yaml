name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # services: cannot pass a start command (entrypoint/command keys are rejected
      # at validation, and options: --entrypoint takes no arguments), so use docker run.
      - name: Start Firestore emulator
        id: firestore
        background: true
        run: |
          docker run --rm -p 8080:8080 \
            --entrypoint sh gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            -c "gcloud emulators firestore start --host-port=0.0.0.0:8080"

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Wait for Firestore emulator
        run: timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 1; done'

      - name: Test
        run: pnpm test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Stop Firestore emulator
        cancel: firestore

  # Deterministic sandbox E2E (test/e2e-sandbox/): the real spawn path
  # (srt --settings → bwrap → node) with a probe pi, inside the
  # e2e image so the base image's apt line (bubblewrap/socat) is exercised.
  sandbox-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build e2e image
        run: docker build --target e2e -t pi-chat-runner-e2e .
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which makes bwrap (run as the agent uid inside the container) fail
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run sandbox E2E
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            pi-chat-runner-e2e
