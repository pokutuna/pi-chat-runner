version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "pokutuna"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    # グループは auto-merge する塊と一致させる (dependabot-auto-merge.yaml)。
    # production は個別 PR にして minor 以上を手動レビューに残す。
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "pokutuna"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
